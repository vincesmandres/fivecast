[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fivecast"
version = "0.1.0"
description = "Read-only research collector for Bitcoin five-minute prediction markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
fivecast = "fivecast.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
